apiVersion: apps/v1
kind: Deployment

metadata:
  name: hospital-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hospital-app

  template:

    metadata:
      labels:
        app: hospital-app

    spec:

      containers:

      - name: hospital-app-container

        image: anandaditya955/hospital-app:v3

        ports:
          - containerPort: 5000

        envFrom:
          - configMapRef:
              name: hospital-app-config

          - secretRef:
              name: hospital-app-secret
